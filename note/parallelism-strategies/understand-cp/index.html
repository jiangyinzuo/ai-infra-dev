<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DCP Decode 通信演示</title>
  <style>
    :root {
      --ink: #182230;
      --muted: #48576a;
      --line: #cad4e0;
      --surface: #f6f8fa;
      --accent: #225baf;
      --communication: #edf4ff;
      color: var(--ink);
      font: 15px/1.5 system-ui, "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; }
    main { max-width: 1080px; margin: auto; padding: 1.5rem 1rem 2rem; }
    h1, h2, p { margin: 0; }
    h1 { font-size: 1.65rem; }
    h2 { font-size: 1.15rem; }
    small, .note { color: var(--muted); font-size: .88rem; }
    small { display: block; }
    .note { margin-top: .3rem; }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr));
      gap: .75rem;
      margin: 1rem 0 .5rem;
    }

    label { display: grid; gap: .25rem; font-size: .9rem; }

    input, select {
      padding: .35rem .55rem;
      color: inherit;
      background: white;
      border: 1px solid var(--line);
      border-radius: .3rem;
      font: inherit;
    }

    input, select { width: 100%; min-width: 0; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #error { color: #a22118; }

    .layout, .diagram { margin-top: 1.2rem; }
    .matrix, .flow { margin-top: .3rem; overflow-x: auto; }
    table { min-width: 100%; }
    th, td { padding: .4rem .55rem; text-align: left; }
    .matrix th:first-child, .flow .step { position: sticky; left: 0; background: white; }
    td { background: var(--surface); border: 1px solid var(--line); }

    .matrix table { border-spacing: 0; }
    .matrix th, .matrix td { border: solid var(--line); border-width: 0 1px 1px 0; white-space: nowrap; }
    .matrix th:not(:first-child), .matrix td { text-align: center; }

    .flow table { border-spacing: 0 .65rem; }
    .flow .step { min-width: 9.5rem; }
    .flow tbody th { font-size: .9rem; }
    .flow tbody th small { font-weight: 400; }
    .flow th[scope="col"]:not(.step), .flow td { min-width: 8.3rem; }
    .flow td + td { border-left: 0; }
    .flow th[scope="colgroup"] { background: var(--surface); }
    .flow th[scope="colgroup"], .flow .group-start { border-left: 2px solid var(--line); }
    .communication td { background: var(--communication); }
    td code, td small { white-space: nowrap; }

    .arrow {
      position: absolute;
      top: -.72rem;
      left: .55rem;
      color: var(--muted);
      line-height: .8rem;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>DCP decode 通信演示</h1>
      <p class="note">单 token decode，PCP=1。</p>
    </header>

    <section aria-label="演示参数">
      <div class="controls">
        <label>TP <input id="tp" type="number" min="1" max="128" step="1" value="8" required></label>
        <label>DCP <input id="dcp" type="number" min="1" max="128" step="1" value="2" required></label>
        <label>Q heads <input id="q-heads" type="number" min="1" max="9007199254740991" step="1" value="32" required></label>
        <label>KV heads <input id="kv-heads" type="number" min="1" max="9007199254740991" step="1" value="4" required></label>
        <label>Block interleave size <input id="interleave" type="number" min="1" max="4096" step="1" value="1" required></label>
        <label>序列长度 <input id="sequence" type="number" min="1" max="2147483647" step="1" value="17" required></label>
        <label>通信路径
          <select id="path">
            <option value="ag_rs">ag_rs</option>
            <option value="a2a">a2a</option>
          </select>
        </label>
      </div>
      <p class="note">序列长度含当前 token。Interleave size 是每次连续分给一个 rank 的 token 数。</p>
      <p id="error" role="alert" hidden></p>
    </section>

    <section id="demo" hidden>
      <div class="layout">
        <h2 id="kv-title">KV 位置</h2>
        <p id="kv-note" class="note"></p>
        <div id="kv-matrix" class="matrix" role="region" aria-labelledby="kv-title" tabindex="0"></div>
      </div>
      <div class="diagram">
        <h2 id="diagram-title">各 DCP group 的 decode 流程</h2>
        <p id="legend" class="note"></p>
        <div id="flow" class="flow" role="region" aria-labelledby="diagram-title" tabindex="0"></div>
      </div>
    </section>

  </main>

  <script>
    const tpInput = document.querySelector("#tp");
    const dcpInput = document.querySelector("#dcp");
    const qHeadsInput = document.querySelector("#q-heads");
    const kvHeadsInput = document.querySelector("#kv-heads");
    const interleaveInput = document.querySelector("#interleave");
    const sequenceInput = document.querySelector("#sequence");
    const pathInput = document.querySelector("#path");
    const numericInputs = [tpInput, dcpInput, qHeadsInput, kvHeadsInput, interleaveInput, sequenceInput];
    const error = document.querySelector("#error");
    const demo = document.querySelector("#demo");
    const kvNote = document.querySelector("#kv-note");
    const kvMatrix = document.querySelector("#kv-matrix");
    const legend = document.querySelector("#legend");
    const flow = document.querySelector("#flow");

    function validate({ tp, dcp, qHeads, kvHeads }) {
      const invalid = numericInputs.find((input) => !input.validity.valid);
      if (invalid) return invalid.validationMessage;
      if (tp % dcp !== 0) return "PCP=1 时，TP 必须能被 DCP 整除。";
      if (qHeads % kvHeads !== 0) return "Q heads 数量必须能被 KV heads 数量整除。";
      if (qHeads % tp !== 0) return "Q heads 数量必须能被 TP 整除。";
      if (tp % kvHeads !== 0 && kvHeads % tp !== 0) {
        return "TP 和 KV heads 数量中，较大的必须能被较小的整除。";
      }
      if (dcp > 1 && (tp / kvHeads) % dcp !== 0) {
        return "DCP > 1 时，TP / KV heads 必须是 DCP 的整数倍，同组 rank 才能共享一个 KV head。";
      }
      return "";
    }

    // 与 vLLM get_dcp_local_seq_lens 的计算一致。
    function localSequenceLength(sequence, dcp, interleave, rank) {
      const base = Math.floor(sequence / (interleave * dcp)) * interleave;
      const remainder = sequence - base * dcp;
      const extra = Math.min(Math.max(remainder - rank * interleave, 0), interleave);
      return base + extra;
    }

    function formatNumber(value) {
      return value.toLocaleString("en-US");
    }

    function rangeLabel(start, end, prefix = "") {
      const first = `${prefix}${start}`;
      return start === end ? first : `${first}–${prefix}${end}`;
    }

    function kvHeadLabel(rank, tp, kvHeads) {
      const count = Math.max(1, kvHeads / tp);
      const start = tp > kvHeads ? Math.floor(rank / (tp / kvHeads)) : rank * count;
      return `KV[${rangeLabel(start, start + count - 1)}]`;
    }

    function blocks(symbol, ids) {
      return `<code>${ids.map((id) => `${symbol}[${id}]`).join(" · ")}</code>`;
    }

    function renderFlow({ tp, dcp, qHeads, kvHeads, path }, groupStarts, lengths) {
      const ranks = Array.from({ length: tp }, (_, rank) => rank);
      const qHeadsPerRank = qHeads / tp;
      const queryRange = (start, end) => rangeLabel(start * qHeadsPerRank, end * qHeadsPerRank - 1);
      const queryRanges = ranks.map((rank) => queryRange(rank, rank + 1));
      const groupStartClass = (rank) => rank % dcp === 0 ? ' class="group-start"' : "";
      const rows = [];

      function addStep(title, description, cell, communication = false) {
        const arrow = rows.length ? '<span class="arrow" aria-hidden="true">↓</span>' : "";
        rows.push(`<tr${communication ? ' class="communication"' : ""}>
          <th class="step" scope="row">${arrow}${title}<small>${description}</small></th>
          ${ranks.map((rank) => `<td${groupStartClass(rank)}>${cell(rank)}</td>`).join("")}
        </tr>`);
      }

      const queryLegend = `每个 KV head 对应 ${qHeads / kvHeads} 个连续的 Q heads。`;
      const partialLegend = ' <code>P[s→r]</code> 含 rank s 对 rank r 原有 Q heads 的部分输出和 LSE。<code>P′[s→r]</code> 是按 LSE 加权后的部分输出。';
      legend.innerHTML = queryLegend + (dcp > 1 ? partialLegend : "");

      addStep("Q 投影", "TP 按 head 切分", (rank) => blocks("Q", [queryRanges[rank]]));
      const complete = (rank) => `完整输出 ${blocks("O", [queryRanges[rank]])}`;
      if (dcp === 1) {
        addStep("本地 attention", "DCP=1，使用完整序列的 KV", complete);
      } else {
        const groupOf = (rank) => Math.floor(rank / dcp);
        const members = groupStarts.map((start) => dcp <= 3
          ? ranks.slice(start, start + dcp)
          : [`${start}…${start + dcp - 1}`]);
        const gathered = groupStarts.map((start) => blocks("Q", dcp <= 3
          ? queryRanges.slice(start, start + dcp)
          : [queryRange(start, start + dcp)]));
        const outgoing = (symbol, rank) => blocks(symbol, members[groupOf(rank)].map((owner) => `${rank}→${owner}`));
        const reduce = (rank) => {
          const start = groupStarts[groupOf(rank)];
          const sources = dcp <= 3 ? members[groupOf(rank)] : [start, "…", start + dcp - 1];
          const terms = sources.map((source) => source === "…" ? source : `P′[${source}→${rank}]`);
          return `${complete(rank)}<small>= <code>${terms.join(" + ")}</code></small>`;
        };

        addStep("AllGather(Q)", "在组内沿 head 维拼接", (rank) => gathered[groupOf(rank)], true);
        addStep("本地 attention", "组内 Q × 本地 KV", (rank) => {
          const partials = outgoing("P", rank);
          return lengths[rank % dcp] ? partials : `${partials}<small>空分片，贡献为 0</small>`;
        });

        if (path === "a2a") {
          addStep("AllToAll(O, LSE)", "按 head 归属打包并交换",
            (rank) => blocks("P", members[groupOf(rank)].map((source) => `${source}→${rank}`)), true);
          addStep("本地 reduce", "按同一 head 的 LSE 加权求和", reduce);
        } else {
          addStep("AllGather(LSE)", "收集各分片的归并统计量", () => `收到 ${dcp} 个 rank 的 LSE`, true);
          addStep("校正本地输出", "按同一 head 的全组 LSE 加权", (rank) => outgoing("P′", rank));
          addStep("ReduceScatter(O)", "对同一 head 求和并交回归属 rank", reduce, true);
        }
      }

      flow.innerHTML = `<table>
        <colgroup span="1"></colgroup>
        ${groupStarts.map(() => `<colgroup span="${dcp}"></colgroup>`).join("")}
        <thead>
          <tr><th class="step" scope="col" rowspan="2">计算步骤</th>${groupStarts.map((_, group) => `
            <th scope="colgroup" colspan="${dcp}">group ${group}</th>
          `).join("")}</tr>
          <tr>${ranks.map((rank) => `
            <th${groupStartClass(rank)} scope="col">rank ${rank}<small>${kvHeadLabel(rank, tp, kvHeads)} · ${formatNumber(lengths[rank % dcp])} tokens</small></th>
          `).join("")}</tr>
        </thead>
        <tbody>${rows.join("")}</tbody>
      </table>`;
    }

    function renderKvMatrix({ tp, dcp, kvHeads, sequence, interleave }, groupStarts, lengths) {
      const stride = dcp * interleave;
      const positions = lengths.map((length, offset) => {
        if (length === 0) return "空分片";
        if (dcp === 1) return rangeLabel(0, sequence - 1, "t");

        const chunks = Math.ceil(length / interleave);
        const chunkLabel = (index) => {
          const start = offset * interleave + index * stride;
          return rangeLabel(start, Math.min(start + interleave, sequence) - 1, "t");
        };
        if (chunks === 1) return chunkLabel(0);
        if (chunks === 2) return `${chunkLabel(0)}, ${chunkLabel(1)}`;
        const middle = chunks > 3 ? ", …" : "";
        return `${chunkLabel(0)}, ${chunkLabel(1)}${middle}, ${chunkLabel(chunks - 1)}`;
      });

      kvNote.textContent = "列标题为各分片的 token 位置，格内为持有分片的 TP rank。";
      if (dcp > 1 && lengths[0] > 3 * interleave) {
        kvNote.textContent += `省略号内每隔 ${stride} 个 token 重复一段。`;
      }
      kvMatrix.innerHTML = `<table>
        <thead><tr><th scope="col">DCP group</th>${positions.map((label) => `
          <th scope="col"><code>${label}</code></th>
        `).join("")}</tr></thead>
        <tbody>${groupStarts.map((start, group) => `<tr>
          <th scope="row">group ${group}<small>${kvHeadLabel(start, tp, kvHeads)}</small></th>
          ${positions.map((_, offset) => `<td>rank ${start + offset}</td>`).join("")}
        </tr>`).join("")}</tbody>
      </table>`;
    }

    function render() {
      const state = {
        tp: tpInput.valueAsNumber,
        dcp: dcpInput.valueAsNumber,
        qHeads: qHeadsInput.valueAsNumber,
        kvHeads: kvHeadsInput.valueAsNumber,
        interleave: interleaveInput.valueAsNumber,
        sequence: sequenceInput.valueAsNumber,
        path: pathInput.value
      };
      const message = validate(state);
      error.textContent = message;
      error.hidden = !message;
      demo.hidden = Boolean(message);
      if (message) return;

      const groupStarts = Array.from({ length: state.tp / state.dcp }, (_, group) => group * state.dcp);
      const lengths = Array.from({ length: state.dcp }, (_, rank) =>
        localSequenceLength(state.sequence, state.dcp, state.interleave, rank));
      renderKvMatrix(state, groupStarts, lengths);
      renderFlow(state, groupStarts, lengths);
    }

    for (const input of numericInputs) input.addEventListener("input", render);
    pathInput.addEventListener("change", render);
    render();
  </script>
</body>
</html>
