<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">vLLM DCP with MLA: KV layout, prefill and decode</title>
  <desc id="desc">DCP interleaves MLA compressed KV tokens across ranks. Prefill gathers query heads and KV sequence shards; decode gathers query heads and merges local outputs with LSE.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="currentColor"/>
    </marker>
    <style>
      text { font-family: sans-serif; fill: currentColor; }
      .title { font-size: 25px; font-weight: 700; }
      .h { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; }
      .box { fill: var(--surface); stroke: var(--border); stroke-width: 1.5; rx: 9; }
      .accent { fill: var(--surface); stroke: var(--accent); stroke-width: 2; rx: 9; }
      .muted { fill: var(--muted); }
      .line { stroke: currentColor; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .dash { stroke: var(--muted); stroke-dasharray: 6 5; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .grid { stroke: var(--border); stroke-width: 1; fill: var(--surface); }
      .r0 { fill: var(--c1); opacity: .75; }
      .r1 { fill: var(--c2); opacity: .75; }
      .r2 { fill: var(--c3); opacity: .75; }
      .r3 { fill: var(--c4); opacity: .75; }
    </style>
  </defs>

  <text x="40" y="42" class="title">vLLM DCP + MLA</text>
  <text x="40" y="68" class="body muted">基础 DCP：PCP=1；DCP 复用 TP ranks，沿 sequence 维度切分 KV cache</text>

  <rect x="40" y="95" width="1120" height="190" class="box"/>
  <text x="62" y="125" class="h">1. KV cache layout：interleave，不是连续切段</text>
  <text x="62" y="151" class="body">virtual_block_size = B × D；I = cp_kv_cache_interleave_size</text>
  <text x="62" y="174" class="small">target_rank = ((x mod (B×D)) div I) mod D</text>
  <text x="62" y="197" class="small">local_position = (x div (B×D))×B + (offset div (I×D))×I + (offset mod I)</text>

  <text x="62" y="231" class="body">例：B=4，D=4，I=1；一个虚拟 block 覆盖 16 个 token</text>
  <g transform="translate(62,245)">
    <text x="0" y="16" class="small">global x</text>
    <text x="75" y="16" class="small">0</text><text x="119" y="16" class="small">1</text><text x="163" y="16" class="small">2</text><text x="207" y="16" class="small">3</text>
    <text x="251" y="16" class="small">4</text><text x="295" y="16" class="small">5</text><text x="339" y="16" class="small">6</text><text x="383" y="16" class="small">7</text>
    <text x="427" y="16" class="small">8</text><text x="471" y="16" class="small">9</text><text x="515" y="16" class="small">10</text><text x="563" y="16" class="small">11</text>
    <text x="611" y="16" class="small">12</text><text x="659" y="16" class="small">13</text><text x="707" y="16" class="small">14</text><text x="755" y="16" class="small">15</text>
    <text x="0" y="42" class="small">owner</text>
    <rect x="70" y="25" width="40" height="25" class="grid r0"/><rect x="114" y="25" width="40" height="25" class="grid r1"/><rect x="158" y="25" width="40" height="25" class="grid r2"/><rect x="202" y="25" width="40" height="25" class="grid r3"/>
    <rect x="246" y="25" width="40" height="25" class="grid r0"/><rect x="290" y="25" width="40" height="25" class="grid r1"/><rect x="334" y="25" width="40" height="25" class="grid r2"/><rect x="378" y="25" width="40" height="25" class="grid r3"/>
    <rect x="422" y="25" width="40" height="25" class="grid r0"/><rect x="466" y="25" width="40" height="25" class="grid r1"/><rect x="510" y="25" width="40" height="25" class="grid r2"/><rect x="554" y="25" width="40" height="25" class="grid r3"/>
    <rect x="602" y="25" width="40" height="25" class="grid r0"/><rect x="646" y="25" width="40" height="25" class="grid r1"/><rect x="690" y="25" width="40" height="25" class="grid r2"/><rect x="734" y="25" width="40" height="25" class="grid r3"/>
    <text x="83" y="43" class="small">r0</text><text x="127" y="43" class="small">r1</text><text x="171" y="43" class="small">r2</text><text x="215" y="43" class="small">r3</text>
  </g>

  <rect x="40" y="315" width="540" height="520" class="box"/>
  <text x="62" y="348" class="h">2. Prefill：Q/KV gather → reorg → attention</text>
  <rect x="62" y="370" width="210" height="70" class="accent"/>
  <text x="78" y="398" class="body">hidden states</text>
  <text x="78" y="420" class="small">q_nope/q_pe + new_kv_c/k_pe</text>
  <path d="M272 405 H325" class="line"/>
  <rect x="325" y="370" width="205" height="70" class="box"/>
  <text x="341" y="398" class="body">Q gather + slot map</text>
  <text x="341" y="420" class="small">Q: head；KV: owner/PAD</text>

  <path d="M165 440 V480" class="line"/>
  <rect x="62" y="480" width="210" height="82" class="accent"/>
  <text x="78" y="508" class="body">rank-local paged KV</text>
  <text x="78" y="530" class="small">[kv_c(Lkv), k_pe(R)]</text>
  <text x="78" y="547" class="small">only local sequence shard</text>
  <path d="M272 521 H325" class="line"/>
  <rect x="325" y="480" width="205" height="82" class="box"/>
  <text x="341" y="508" class="body">DCP all-gather</text>
  <text x="341" y="530" class="small">KV / sequence axis</text>
  <text x="341" y="547" class="small">bounded by chunk workspace</text>

  <path d="M427 562 V606" class="line"/>
  <rect x="325" y="606" width="205" height="82" class="box"/>
  <text x="341" y="634" class="body">reorg_kvcache</text>
  <text x="341" y="656" class="small">restore request order</text>
  <text x="341" y="673" class="small">drop padding rows</text>
  <path d="M325 647 H272" class="line"/>
  <rect x="62" y="606" width="210" height="82" class="box"/>
  <text x="78" y="634" class="body">context attention</text>
  <text x="78" y="656" class="small">MHA / compute-friendly</text>
  <text x="78" y="673" class="small">chunk output + LSE</text>

  <path d="M165 688 V730" class="line"/>
  <rect x="62" y="730" width="468" height="78" class="box"/>
  <text x="82" y="758" class="body">merge current attention with context attention</text>
  <text x="82" y="780" class="small">softmax-safe output/LSE merge → O → output projection</text>

  <rect x="620" y="315" width="540" height="520" class="box"/>
  <text x="642" y="348" class="h">3. Decode：Q gather → local attention → LSE merge</text>

  <g transform="translate(650,377)">
    <rect x="0" y="0" width="110" height="54" class="accent"/><text x="15" y="23" class="body">rank r</text><text x="15" y="42" class="small">q_r heads</text>
    <rect x="130" y="0" width="110" height="54" class="accent"/><text x="145" y="23" class="body">rank r+1</text><text x="145" y="42" class="small">q heads</text>
    <rect x="260" y="0" width="110" height="54" class="accent"/><text x="275" y="23" class="body">rank ...</text><text x="275" y="42" class="small">q heads</text>
    <path d="M110 27 H130 M240 27 H260" class="line"/>
  </g>
  <path d="M835 431 V470" class="line"/>
  <rect x="650" y="470" width="480" height="68" class="box"/>
  <text x="670" y="497" class="body">DCP all-gather(Q, head axis)</text>
  <text x="670" y="519" class="small">Q = [token, N_local×D, Lkv+R]</text>

  <path d="M890 538 V580" class="line"/>
  <rect x="650" y="580" width="220" height="94" class="accent"/>
  <text x="670" y="609" class="body">each rank</text>
  <text x="670" y="632" class="small">full Q heads</text>
  <text x="670" y="650" class="small">local KV shard</text>
  <text x="670" y="668" class="small">→ O_r, LSE_r</text>
  <path d="M870 627 H910" class="line"/>
  <rect x="910" y="580" width="220" height="94" class="box"/>
  <text x="930" y="609" class="body">fused DCP A2A</text>
  <text x="930" y="632" class="small">exchange partial O/LSE</text>
  <text x="930" y="650" class="small">softmax-safe combine</text>
  <text x="930" y="668" class="small">→ local head range</text>

  <path d="M1020 674 V719" class="line"/>
  <rect x="650" y="719" width="480" height="78" class="box"/>
  <text x="670" y="747" class="body">V-up projection → output projection</text>
  <text x="670" y="770" class="small">DCP changes ownership/communication, not attention semantics</text>
</svg>
