<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">vLLM DCP with MLA: KV layout, prefill and decode</title>
  <desc id="desc">DCP interleaves MLA compressed KV tokens across ranks. Dense prefill gathers history KV and uses TP-local query heads. Decode gathers query heads and merges local outputs with LSE.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: sans-serif; fill: #1f2937; }
      .title { font-size: 25px; font-weight: 700; }
      .h { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; }
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
      .accent { fill: #fff; stroke: #2563eb; stroke-width: 1.5; rx: 8; }
      .muted { fill: #475569; }
      .line { stroke: #334155; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .grid { stroke: #94a3b8; stroke-width: 1; }
      .r0 { fill: #bfdbfe; }
      .r1 { fill: #a7f3d0; }
      .r2 { fill: #fde68a; }
      .r3 { fill: #fecaca; }
      .center { text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="#fff"/>
  <text x="40" y="42" class="title">vLLM DCP + MLA</text>
  <text x="40" y="68" class="body muted">PCP=1: DCP reuses TP ranks and shards the KV cache along the sequence axis.</text>

  <rect x="40" y="95" width="1120" height="210" class="box"/>
  <text x="62" y="125" class="h">1. KV cache layout: interleaved token ownership</text>
  <text x="62" y="151" class="body">B = block_size; D = dcp_size; I = cp_kv_cache_interleave_size</text>
  <text x="62" y="174" class="small">offset = x mod (B×D); target_rank = (offset div I) mod D</text>
  <text x="62" y="197" class="small">local_position = (x div (B×D))×B + (offset div (I×D))×I + (offset mod I)</text>

  <text x="62" y="231" class="body">Example: B=4, D=4, I=1; one virtual block covers 16 tokens</text>
  <g transform="translate(62,245)">
    <text x="0" y="16" class="small">global x</text>
    <g class="small center">
      <text x="90" y="16">0</text><text x="134" y="16">1</text><text x="178" y="16">2</text><text x="222" y="16">3</text>
      <text x="266" y="16">4</text><text x="310" y="16">5</text><text x="354" y="16">6</text><text x="398" y="16">7</text>
      <text x="442" y="16">8</text><text x="486" y="16">9</text><text x="530" y="16">10</text><text x="574" y="16">11</text>
      <text x="622" y="16">12</text><text x="666" y="16">13</text><text x="710" y="16">14</text><text x="754" y="16">15</text>
    </g>
    <text x="0" y="42" class="small">owner</text>
    <rect x="70" y="25" width="40" height="25" class="grid r0"/><rect x="114" y="25" width="40" height="25" class="grid r1"/><rect x="158" y="25" width="40" height="25" class="grid r2"/><rect x="202" y="25" width="40" height="25" class="grid r3"/>
    <rect x="246" y="25" width="40" height="25" class="grid r0"/><rect x="290" y="25" width="40" height="25" class="grid r1"/><rect x="334" y="25" width="40" height="25" class="grid r2"/><rect x="378" y="25" width="40" height="25" class="grid r3"/>
    <rect x="422" y="25" width="40" height="25" class="grid r0"/><rect x="466" y="25" width="40" height="25" class="grid r1"/><rect x="510" y="25" width="40" height="25" class="grid r2"/><rect x="554" y="25" width="40" height="25" class="grid r3"/>
    <rect x="602" y="25" width="40" height="25" class="grid r0"/><rect x="646" y="25" width="40" height="25" class="grid r1"/><rect x="690" y="25" width="40" height="25" class="grid r2"/><rect x="734" y="25" width="40" height="25" class="grid r3"/>
    <text x="83" y="43" class="small">r0</text><text x="127" y="43" class="small">r1</text><text x="171" y="43" class="small">r2</text><text x="215" y="43" class="small">r3</text>
  </g>

  <rect x="40" y="315" width="540" height="520" class="box"/>
  <text x="62" y="348" class="h">2. Dense Prefill: gather history KV, keep Q local</text>
  <rect x="62" y="370" width="496" height="65" class="accent"/>
  <text x="78" y="396" class="body">TP-local Q heads and new KV</text>
  <text x="78" y="418" class="small">q_nope / q_pe + new_kv_c / new_k_pe</text>

  <path d="M172 435 V614" class="line"/>
  <path d="M172 448 H306 V652 H330" class="line"/>
  <path d="M444 435 V460" class="line"/>
  <rect x="330" y="460" width="228" height="60" class="accent"/>
  <text x="346" y="484" class="body">rank-local paged KV</text>
  <text x="346" y="505" class="small">Slot map: owner writes KV</text>
  <path d="M444 520 V540" class="line"/>
  <rect x="330" y="540" width="228" height="55" class="box"/>
  <text x="346" y="562" class="body">Gather a history KV chunk</text>
  <text x="346" y="582" class="small">Gather by token; reorg / unpad</text>
  <path d="M444 595 V614" class="line"/>

  <rect x="62" y="614" width="220" height="76" class="box"/>
  <text x="78" y="640" class="body">current attention</text>
  <text x="78" y="661" class="small">Local Q × new K/V (causal)</text>
  <text x="78" y="680" class="small">Current output + LSE</text>
  <rect x="330" y="614" width="228" height="76" class="box"/>
  <text x="346" y="640" class="body">context attention</text>
  <text x="346" y="661" class="small">Local Q × projected K/V</text>
  <text x="346" y="680" class="small">Per-chunk output + LSE</text>

  <path d="M172 690 V742" class="line"/>
  <path d="M444 690 V742" class="line"/>
  <rect x="62" y="742" width="496" height="66" class="box"/>
  <text x="78" y="769" class="body">Merge current and context outputs using LSE</text>
  <text x="78" y="791" class="small">O → output projection</text>

  <rect x="620" y="315" width="540" height="520" class="box"/>
  <text x="642" y="348" class="h">3. Decode: gather Q, then merge output/LSE</text>

  <g transform="translate(650,377)">
    <rect x="0" y="0" width="110" height="54" class="accent"/><text x="15" y="23" class="body">rank 0</text><text x="15" y="42" class="small">q_0 heads</text>
    <rect x="185" y="0" width="110" height="54" class="accent"/><text x="200" y="23" class="body">rank 1</text><text x="200" y="42" class="small">q_1 heads</text>
    <rect x="370" y="0" width="110" height="54" class="accent"/><text x="385" y="23" class="body">rank D−1</text><text x="385" y="42" class="small">local Q heads</text>
  </g>
  <path d="M705 431 V470" class="line"/>
  <path d="M890 431 V470" class="line"/>
  <path d="M1075 431 V470" class="line"/>
  <rect x="650" y="470" width="480" height="68" class="box"/>
  <text x="670" y="497" class="body">DCP all-gather(Q, head axis)</text>
  <text x="670" y="519" class="small">Q = [token, N_local×D, Lkv+R]</text>

  <path d="M760 538 V580" class="line"/>
  <rect x="650" y="580" width="220" height="94" class="accent"/>
  <text x="670" y="609" class="body">each rank</text>
  <text x="670" y="632" class="small">DCP group Q heads</text>
  <text x="670" y="650" class="small">local KV shard</text>
  <text x="670" y="668" class="small">→ O_r, LSE_r</text>
  <path d="M870 627 H910" class="line"/>
  <rect x="910" y="580" width="220" height="94" class="box"/>
  <text x="930" y="609" class="body">DCP output/LSE merge</text>
  <text x="930" y="632" class="small">exchange partial O/LSE</text>
  <text x="930" y="650" class="small">softmax-safe combine</text>
  <text x="930" y="668" class="small">→ local head range</text>

  <path d="M1020 674 V719" class="line"/>
  <rect x="650" y="719" width="480" height="78" class="box"/>
  <text x="670" y="747" class="body">V-up projection → output projection</text>
  <text x="670" y="770" class="small">DCP changes ownership/communication, not attention semantics</text>
</svg>
