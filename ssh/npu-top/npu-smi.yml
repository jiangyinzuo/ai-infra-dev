---
# 查询部分服务器： --limit 'npu01,npu02'
# 指定命令路径： -e npu_smi_bin=/usr/local/sbin/npu-smi
# 需要 sudo 时： --become；需要 sudo 密码时再追加 --ask-become-pass
# --containers：显示进程的 Docker 归属；远端需 Python 3，Docker 查询需对应权限。
- name: 查询每台服务器所有 NPU 的利用率
  hosts: npu_servers
  gather_facts: false
  tasks:
    - name: 执行 npu-smi info（远端无需 Python）
      ansible.builtin.raw: >-
        PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH
        {{ npu_smi_bin | default('npu-smi') | quote }} info
      register: npu_smi_result
      changed_when: false
      ignore_errors: true
      ignore_unreachable: true

    - name: 在控制端解析利用率、内存和进程数量
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/npu_smi_summary.py"
          - --json
        stdin: "{{ npu_smi_result.stdout }}"
      delegate_to: localhost
      become: false
      register: npu_summary
      changed_when: false
      when: npu_smi_result.rc | default(-1) == 0
      ignore_errors: true

    # npu_top_output：只显示利用率、TOP10及错误，不显示成功中间任务或 recap。
    - name: 显示当前服务器的精简利用率
      tags: [npu_top_output]
      ansible.builtin.debug:
        msg: "{{ (npu_summary.stdout | from_json).lines }}"
      when: npu_summary.rc | default(-1) == 0

    - name: 查询宿主机进程的容器归属
      vars:
        ansible_ssh_use_tty: false
      ansible.builtin.raw: >-
        python3 -c {{ lookup('ansible.builtin.file', playbook_dir ~ '/npu_process_containers.py') | quote }}
        {{ npu_smi_result.stdout | quote }}
      register: npu_containers_result
      changed_when: false
      when:
        - npu_containers | default(false) | bool
        - npu_smi_result.rc | default(-1) == 0
      ignore_errors: true
      ignore_unreachable: true

    - name: 显示进程及容器归属
      tags: [npu_top_output]
      ansible.builtin.debug:
        msg: "{{ (npu_containers_result.stdout | from_json) if npu_containers_result.rc | default(-1) == 0 else ['容器归属查询失败：' ~ (npu_containers_result.stderr | default('远端不可用'))] }}"
      when:
        - npu_containers | default(false) | bool
        - npu_smi_result.rc | default(-1) == 0

    - name: 汇总所有已选择服务器的空闲卡 TOP10
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/npu_smi_summary.py"
          - --rank
        stdin: >-
          {{ dict(ansible_play_hosts_all | zip(ansible_play_hosts_all | map('extract', hostvars, 'npu_summary'))) | to_json }}
      delegate_to: localhost
      become: false
      run_once: true
      register: npu_ranking
      changed_when: false

    - name: 显示空闲卡 TOP10
      tags: [npu_top_output]
      ansible.builtin.debug:
        msg: "{{ npu_ranking.stdout_lines }}"
      run_once: true

    - name: 查询失败的服务器保持失败状态（排名已输出）
      ansible.builtin.assert:
        that:
          - npu_summary.rc | default(-1) == 0
        fail_msg: "该服务器未获得有效汇总，已从排名排除。"
        quiet: true
